<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Plan Scaffolder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lesson Plan Scaffolder</h1>
            <p class="subtitle">Generate a first-draft lesson plan from a topic brief</p>
        </header>

        <main class="split">
            <section class="panel input-panel">
                <h2>Input</h2>
                <form id="scaffold-form">
                    <label for="topic">Topic / Brief</label>
                    <textarea id="topic" name="topic" rows="4" placeholder="e.g. Introduction to Photosynthesis" required></textarea>

                    <label for="duration">Duration (minutes)</label>
                    <input type="number" id="duration" name="duration" value="60" min="10" max="300">

                    <label for="notes">Additional Notes <span class="optional">(optional)</span></label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Any specific points to cover, materials available, etc."></textarea>

                    <button type="submit" id="generate-btn">Generate Plan</button>
                </form>
            </section>

            <section class="panel output-panel">
                <h2>Output</h2>
                <div id="output-placeholder" class="placeholder">
                    Your generated lesson plan will appear here.
                </div>
                <div id="output-content" class="hidden">
                    <div class="toolbar">
                        <button id="copy-btn" title="Copy to clipboard">Copy</button>
                        <button id="download-btn" title="Download as .md">Download</button>
                    </div>
                    <pre id="markdown-preview"></pre>
                </div>
            </section>
        </main>

        <footer>
            <p>Lesson Plan Scaffolder v0.1.0</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
